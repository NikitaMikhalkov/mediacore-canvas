services:
  migrate:
    image: ${CANVAS_BACKEND_IMAGE:-open-ai-canvas-backend:server}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}

  backend:
    image: ${CANVAS_BACKEND_IMAGE:-open-ai-canvas-backend:server}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}

  yingce-agent:
    image: ${CANVAS_YINGCE_AGENT_IMAGE:-open-ai-canvas-yingce-agent:server}
    build:
      context: .
      dockerfile: yingce-agent/Dockerfile

  web:
    image: ${CANVAS_WEB_IMAGE:-open-ai-canvas-web:server}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
